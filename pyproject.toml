[project]
name = "microservices-simulator"
version = "0.0.0"
description = "Discrete-event simulator of microservice request flows."
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "results",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "caller",
    "chain",
    "service",
    "simulator",
    "workload",
    "metrics",
    "fault_events",
    "faults",
    "retry_policies",
    "timeout_controllers",
    "experiments",
    "plotting",
    "rl",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
root = "."

[tool.ty.rules]
# Lenient / advisory mode: don't error on missing annotations.
# Adjust as the codebase gains more type coverage.
