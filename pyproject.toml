[project]
name = "microservices-simulator"
version = "0.0.0"
description = "Discrete-event simulator of microservice request flows."
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
    "pandas",
    "scipy",
]
arolla = [
    "pyyaml",
]
# The Gymnasium environment (`msim.rl`): the simulator as a control problem.
rl = [
    "gymnasium>=1.0",
]
# Training on it (`msim.rl.train`): Stable-Baselines3, which brings PyTorch.
train = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.9",
    "torch>=2.8",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "scipy",
    "matplotlib",
    "pandas",
    "pyyaml",
    "gymnasium>=1.0",
]

# PyTorch from its CPU-only index: the policies trained here are small MLPs, the
# simulator is the bottleneck, and the default Linux wheels pull in gigabytes of CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "msim"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "results",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = [
    "msim",
    "examples",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
root = ["./src", "."]

[tool.ty.rules]
# Enforced via pre-commit. Lenient on missing annotations for now,
# but real type errors (None narrowing, protocol mismatches, numpy
# misuse) are kept clean.

# Stable-Baselines3 and PyTorch are the `train` extra, which the dev group does
# not install: the two files that import them must still pass without them.
[[tool.ty.overrides]]
include = ["src/msim/rl/train.py", "tests/test_rl_training.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = [
    "msim",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
