# A limiter on a service that is called by another service, and on one that retries
# itself under a client that retries too.
name: synthetic_admission_between_services
seed: 1
services:
  - name: db
    latency: {median_ms: 15, lognorm_sigma: 0.4}
    workers: 8
    queue_capacity: 100
    global_retry_budget: {target_rps: 10, max_burst: 5}
    partial_failures: [{start_s: 10, end_s: 20, p_fail: 0.5}]
  - name: app
    latency: {median_ms: 5, lognorm_sigma: 0.2}
    workers: 16
    queue_capacity: 100
    retry: {type: fixed, max_attempts: 4, delay_ms: 0}
    dependencies: [{service: db}]
  - name: both
    latency: {median_ms: 15, lognorm_sigma: 0.4}
    workers: 8
    queue_capacity: 100
    timeout: {attempt_ms: 200}
    retry: {type: fixed, max_attempts: 2, delay_ms: 0}
    retry_budget: {budget_ratio: 0.1, max_retries: 10}
    partial_failures: [{start_s: 10, end_s: 20, p_fail: 0.5}]
clients:
  - name: through_app
    target_service: app
    workload: &load {base_rps: 80, duration_s: 30}
  - name: retrying_client
    target_service: both
    retry: {type: fixed, max_attempts: 3, delay_ms: 5}
    timeout: {attempt_ms: 500}
    workload: *load
